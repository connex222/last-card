<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Last Card</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="preload" href="/fonts/bodoni-moda-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="lounge ph overscroll-none">
  <div id="toast-wrap" aria-live="assertive"></div>
  <div id="edge" class="ph-edge" aria-hidden="true"></div>

  <!-- Join -->
  <main id="screen-join" class="ph-wrap min-h-[100dvh] flex flex-col gap-5 p-5" hidden>
    <div class="ph-hero" id="hero" aria-hidden="true"></div>
    <h1 class="ph-title serif gold-text text-center">Last Card</h1>
    <label class="flex flex-col gap-2">
      <span class="ph-label">Room code on the TV</span>
      <input id="in-code" class="field uppercase tracking-[.3em] text-center text-3xl" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD">
    </label>
    <label class="flex flex-col gap-2">
      <span class="ph-label">Your name</span>
      <input id="in-name" class="field" maxlength="14" autocomplete="nickname" placeholder="e.g. Shaun">
    </label>
    <fieldset class="flex flex-col gap-2">
      <legend class="ph-label mb-2">Pick your avatar</legend>
      <div id="avatars" class="grid grid-cols-6 gap-2"></div>
    </fieldset>
    <p id="join-error" class="font-bold min-h-[1.5em]" style="color:#ff9aa8" role="alert"></p>
    <div class="mt-auto flex flex-col gap-3">
      <button id="btn-join" class="btn btn-go w-full text-xl">Join the table</button>
      <p class="ph-or">or</p>
      <button id="btn-solo" class="btn btn-ghost w-full">Play solo on this phone</button>
    </div>
  </main>

  <!-- Waiting room -->
  <main id="screen-wait" class="ph-wrap min-h-[100dvh] flex flex-col gap-4 p-5" hidden>
    <header class="flex items-center gap-3 pt-2">
      <span id="w-avatar" class="text-5xl"></span>
      <div class="flex-1 min-w-0">
        <p id="w-name" class="text-2xl font-extrabold truncate"></p>
        <p class="muted font-bold">Table <span id="w-code"></span></p>
      </div>
    </header>
    <p id="w-message" class="text-xl font-bold leading-snug"></p>

    <section id="w-modes-wrap" class="flex flex-col gap-2" aria-label="Choose a game">
      <p class="ph-label" id="w-modes-label">Game</p>
      <div id="w-modes" class="flex flex-col gap-2"></div>
    </section>

    <section id="w-bots" class="ph-panel p-4 flex flex-col gap-3" hidden>
      <div class="flex items-center justify-between">
        <span class="font-extrabold">Computer players</span>
        <div class="stepper">
          <button id="w-bot-minus" aria-label="One fewer computer player">−</button>
          <output id="w-bot-count">0</output>
          <button id="w-bot-plus" aria-label="One more computer player">+</button>
        </div>
      </div>
      <div id="w-bot-level" class="seg self-start" role="group" aria-label="Difficulty">
        <button data-level="easy">Easy</button>
        <button data-level="medium">Medium</button>
        <button data-level="hard">Hard</button>
      </div>
      <div id="w-teams" class="flex items-center justify-between gap-3" hidden>
        <span class="font-extrabold">Team size</span>
        <div id="w-team-size" class="seg" role="group" aria-label="Team size">
          <button data-size="2">Pairs</button>
          <button data-size="3">Threes</button>
        </div>
      </div>
    </section>
 <div id="w-match-wrap" class="flex flex-col gap-2" hidden>
      <p class="ph-label">Match</p>
      <div id="w-match" class="seg self-start" role="group" aria-label="Match"></div>
    </div>
    <p id="w-team-problem" class="font-bold" style="color:#ffcf7a" hidden></p>

    <ul id="w-players" class="flex flex-col gap-2"></ul>
    <div class="mt-auto flex flex-col gap-3 pb-[env(safe-area-inset-bottom)]">
      <button id="btn-start" class="btn btn-go w-full text-xl" hidden>Deal the cards</button>
      <button class="btn btn-ghost w-full" data-leave>Leave the table</button>
    </div>
  </main>

  <!-- Playing -->
  <main id="screen-play" class="ph-play ph-wrap" hidden>
    <header class="ph-top">
      <span id="p-avatar" class="me"></span>
      <p class="nm"><span id="p-name"></span> <span id="p-team" class="ph-team" hidden></span></p>
      <p id="p-count" class="ct"></p>
      <button class="ph-icon-btn" data-leave aria-label="Leave the table">✕</button>
    </header>

    <ul id="p-seats" class="ph-seats" aria-label="Players"></ul>

    <section class="ph-table" aria-label="Table">
      <div id="p-top" class="pile"></div>
      <div class="flex flex-col items-center">
        <div class="flex items-center gap-2"><p id="p-color" class="ph-color"></p><p id="p-stack" class="ph-stack" hidden></p><p id="p-fuse" class="ph-fuse" hidden>Fuse lit</p></div>
        <p id="p-log" class="ph-log" aria-live="polite"></p>
      </div>
    </section>

    <p id="p-turn" class="ph-turn"></p>
    <div id="p-clock" class="ph-clock" hidden aria-hidden="true"><i></i></div>

    <section id="p-signals" class="ph-signals" aria-label="Signal your partner" hidden>
      <button type="button" data-signal="have">I’ve got…</button>
      <button type="button" data-signal="hold">Hold back</button>
      <button type="button" data-signal="help">Help!</button>
      <div id="p-have" class="ph-have" hidden>
        <button type="button" data-have="red" style="background:var(--red)" aria-label="I've got Red">●</button>
        <button type="button" data-have="yellow" style="background:var(--yellow);color:#1a1405" aria-label="I've got Yellow">★</button>
        <button type="button" data-have="green" style="background:var(--green)" aria-label="I've got Green">▲</button>
        <button type="button" data-have="blue" style="background:var(--blue)" aria-label="I've got Blue">■</button>
      </div>
    </section>

    <section class="ph-actions" aria-label="Actions">
      <button id="btn-draw" class="ph-draw" disabled>Draw a card</button>
      <button id="btn-shout" class="ph-shout">Last Card!</button>
    </section>

    <section id="p-hand" class="ph-hand" aria-label="Your cards">
      <p id="p-hint" class="ph-hint"></p>
      <div id="p-track" class="ph-track"></div>
    </section>
  </main>

  <!-- Solo setup -->
  <div id="modal-solo" class="ph-sheet" role="dialog" aria-modal="true" aria-labelledby="solo-title" hidden>
    <div class="ph-sheet-in">
      <h2 id="solo-title" class="serif gold-text text-4xl text-center">Solo</h2>
      <p class="text-center font-semibold muted">Classic rules against the house. No TV needed.</p>
      <div class="flex items-center justify-between">
        <span class="font-extrabold text-lg">Opponents</span>
        <div class="stepper">
          <button id="solo-minus" aria-label="One fewer opponent">−</button>
          <output id="solo-count">3</output>
          <button id="solo-plus" aria-label="One more opponent">+</button>
        </div>
      </div>
      <div id="solo-level" class="seg self-center" role="group" aria-label="Difficulty">
        <button data-level="easy">Easy</button>
        <button data-level="medium" aria-pressed="true">Medium</button>
        <button data-level="hard">Hard</button>
      </div>
      <p id="solo-error" class="font-bold text-center min-h-[1.5em]" style="color:#ff9aa8" role="alert"></p>
      <button id="btn-solo-go" class="btn btn-go w-full text-xl">Deal me in</button>
      <button id="btn-solo-cancel" class="btn btn-ghost w-full">Cancel</button>
    </div>
  </div>

  <!-- Wild colour wheel -->
  <div id="modal-wild" class="ph-sheet" role="dialog" aria-modal="true" aria-labelledby="wild-title" hidden>
    <div class="ph-sheet-in">
      <h2 id="wild-title" class="serif text-3xl text-center">Choose the next colour</h2>
      <div id="wheel" class="ph-wheel"></div>
      <button id="btn-wild-cancel" class="btn btn-ghost w-full">Cancel</button>
    </div>
  </div>

  <!-- Pile-Up 7: choose who to swap hands with -->
  <div id="modal-swap" class="ph-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-title" hidden>
    <div class="ph-sheet-in">
      <h2 id="swap-title" class="serif text-3xl text-center">Swap hands with…</h2>
      <div id="swap-list" class="flex flex-col gap-2"></div>
      <button id="btn-swap-cancel" class="btn btn-ghost w-full">Cancel</button>
    </div>
  </div>

  <!-- Round over -->
  <div id="modal-end" class="ph-end" hidden>
    <p id="e-avatar" class="av"></p>
    <h2 id="e-title" class="serif gold-text"></h2>
    <p id="e-sub" class="text-lg muted font-semibold"></p>
    <button id="btn-again" class="btn btn-go w-full max-w-sm text-xl" hidden>Deal next round</button>
    <button id="btn-end-leave" class="btn btn-ghost w-full max-w-sm" data-leave hidden>Leave</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/phone.js"></script>
</body>
</html>
