name: Last Card automated end-to-end
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JS syntax
        run: |
          node --check server.js
          node --check game/lastcard.js
          node --check game/catch.js
          node --check public/js/tv.js
          node --check public/js/phone.js
          node --check public/js/avatars.js
      - name: Test CATCH arbitration and game rules
        run: |
          node test/catch.js
          node test/catch-game.js
      - name: Run comprehensive engine and Socket.IO multiplayer simulation
        run: npm test
